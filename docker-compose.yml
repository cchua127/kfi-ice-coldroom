# KFI Ice Ops — local development stack.
# For the droplet, see deploy/docker-compose.prod.yml and the runbook in README.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kfi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kfi_ice}
      # Business dates are `date`; timestamps are timestamptz. Keep the server in UTC
      # and convert for display, so a droplet timezone change can never shift a reading.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kfi} -d ${POSTGRES_DB:-kfi_ice}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
